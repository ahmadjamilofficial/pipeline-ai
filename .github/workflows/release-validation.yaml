name: release-validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  network-performance:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Run Schmoder CI
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: ci.yaml
          repo: coder/schmoder
          inputs: '{ "num_releases": "3", "commit": "${{ github.sha }}" }'
          token: ${{ secrets.CDRCI_SCHMODER_ACTIONS_TOKEN }}
          ref: main
